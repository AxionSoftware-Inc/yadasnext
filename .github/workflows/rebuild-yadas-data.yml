name: Rebuild YaDas data

on:
  push:
    paths:
      - '.github/workflows/rebuild-yadas-data.yml'
      - 'build_data.py'
      - 'data/YaDas_corrections.json'
      - 'data/YaDas_pages_*_verified.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild generated question files
        run: python build_data.py
      - name: Commit regenerated data
        run: |
          if git diff --quiet -- questions-1-80.json questions.js data/questions-1-80.json index.html; then
            echo 'Generated files are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add questions-1-80.json questions.js data/questions-1-80.json index.html
          git commit -m 'Rebuild YaDas question data'
          git push
